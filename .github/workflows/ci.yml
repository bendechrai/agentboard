# Runs `make check` on every pull request (forks included) and on every
# push to staging and main, on the oldest supported Node (the engines
# floor in package.json) and on each newer release line. Pull requests
# into main must come from staging (see CONTRIBUTING.md, "Branches and
# pull requests"); the promotion-source job enforces that.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.16', '22', '24', '26']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: make check

  promotion-source:
    name: promotion source
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require the head branch to be staging
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_REF" != "staging" ]; then
            echo "::error::Pull requests into main must come from staging in this repository, not $HEAD_REPO:$HEAD_REF."
            exit 1
          fi
