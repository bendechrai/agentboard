# Pinned dev toolchain for agentboard. No HTTP service exists (agentboard
# is a local CLI), so this does not join the devtun network or publish
# any ports.
#
# /tmp is a tmpfs in both services. The tests create their boards under
# the OS temporary directory, and every event write fsyncs the file and
# its directory; on the container's overlay filesystem each such write
# cost about 5 ms (against under 0.1 ms on tmpfs), and with every vitest
# worker fsyncing at once, fsync-heavy tests exceeded their timeouts
# under load. Durability across a power loss is not something the tests
# can observe, so nothing they check is lost. `exec` because tests run
# fake executables (such as a fake `gh`) from temporary directories.
services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node-modules-cache:/workspace/node_modules
      - npm-cache:/home/dev/.npm
    tmpfs:
      - /tmp:exec,mode=1777
    command: sleep infinity

  # Same toolchain pinned to the oldest supported Node (package.json
  # engines), so the declared floor is actually tested.
  dev-floor:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: node:22.16.0-bookworm-slim
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node-modules-floor-cache:/workspace/node_modules
      - npm-cache:/home/dev/.npm
    tmpfs:
      - /tmp:exec,mode=1777
    command: sleep infinity

  # The floor Node again, with the oldest git the host model supports
  # (HOST_MODEL_GIT_FLOOR in src/board/git.ts) built from source in the
  # image, for `make check-git-floor`. GIT_VERSION is a full release of
  # that line; src/__tests__/git-floor.test.ts checks that its major and
  # minor match the constant. GIT_SHA256 is the SHA-256 of that release's
  # git-<version>.tar.xz from kernel.org's sha256sums.asc; the build fails
  # on a download that does not match. Its own node_modules volume, so a
  # run beside check-floor never shares one.
  dev-git-floor:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NODE_IMAGE: node:22.16.0-bookworm-slim
        GIT_VERSION: 2.32.7
        GIT_SHA256: 1ea175f21b766c1cbc05b8391e9aaf6a18b0bbbf7c2382449b635dc66bf1c4d0
    working_dir: /workspace
    volumes:
      - .:/workspace
      - node-modules-git-floor-cache:/workspace/node_modules
      - npm-cache:/home/dev/.npm
    tmpfs:
      - /tmp:exec,mode=1777
    command: sleep infinity

volumes:
  node-modules-cache:
  node-modules-floor-cache:
  node-modules-git-floor-cache:
  npm-cache:
